name: Deploy

# Runs after CI passes on main; merging the PR is the approval step.
# Re-run by hand from the Actions tab via workflow_dispatch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit CI tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check configuration
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Repository secret $name is not set"; missing=1; }
          done
          exit $missing

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build

      # Idempotent: only migrations not yet recorded in d1_migrations run.
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote

      - name: Deploy Worker
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          jq -n --arg pw "$ADMIN_PASSWORD" '{ADMIN_PASSWORD: $pw}' > "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file"

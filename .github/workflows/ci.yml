name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build site
        run: npm run build

      # Bundles the Worker and checks bindings without touching Cloudflare.
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
